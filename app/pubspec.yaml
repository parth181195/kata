name: kata
description: "Kata — Fujifilm film recipes, written into your camera's custom slots over USB."
publish_to: 'none'
version: 0.2.2+4

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  shared_preferences: ^2.3.3
  share_plus: ^10.1.2
  file_picker: ^8.1.4
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^7.1.0
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5
  desktop_drop: ^0.6.1
  zxing2: ^0.2.3
  image: ^4.3.0
  path: ^1.9.0
  fuji_ptp:
    path: ../packages/fuji_ptp
  kata_ui:
    path: ../packages/kata_ui
  ofr:
    path: ../packages/ofr
  flutter_svg: ^2.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  url_launcher: ^6.3.2
  crypto: ^3.0.7
  package_info_plus: ^9.0.1

dependency_overrides:
  ofr:
    path: ../packages/ofr

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/cameras/
    - assets/frames/
